name: Agentic verify
description: A deterministic, tamper-evident gate for changes made by AI coding agents. Runs the original tests in a sandbox, detects test tampering, and signs the evidence.
branding:
  icon: shield
  color: green

inputs:
  base:
    description: Commit to verify against. Defaults to the pull request base.
    default: ""
  hidden-tests:
    description: Folder of hidden tests the author never saw (outside the repo, e.g. restored from a secret store).
    default: ""
  loopback:
    description: Let tests use localhost (never the internet). For suites that start local servers.
    default: "false"
  fail-on-unverified:
    description: Fail the job when nothing could verify the change, or it needs human review (CI, policy or sensitive paths).
    default: "true"
  attest:
    description: Sign the evidence with GitHub artifact attestations (needs id-token and attestations write permissions).
    default: "true"
  python-version:
    default: "3.13"

outputs:
  verdict:
    description: PASS, FAIL or UNVERIFIED
    value: ${{ steps.verify.outputs.verdict }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install agentic and the Linux sandbox
      shell: bash
      run: |
        python -m pip install -q "${{ github.action_path }}" pytest
        sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Verify
      id: verify
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        HIDDEN: ${{ inputs.hidden-tests }}
        LOOPBACK: ${{ inputs.loopback }}
        SUBJECT: git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}
      run: |
        args=(verify --base "$BASE" --head HEAD --json agentic-report.json --predicate agentic-predicate.json
              --evidence agentic-evidence.json --subject "$SUBJECT" --summary-md "$GITHUB_STEP_SUMMARY")
        [ -n "$HIDDEN" ] && args+=(--hidden "$HIDDEN")
        [ "$LOOPBACK" = "true" ] && args+=(--loopback)
        set +e
        agentic "${args[@]}"
        code=$?
        set -e
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ -f agentic-report.json ]; then
          echo "verdict=$(python -c 'import json; print(json.load(open("agentic-report.json"))["verdict"])')" >> "$GITHUB_OUTPUT"
          echo "digest=$(python -c 'import json; print(json.load(open("agentic-report.json"))["tree_sha256"])')" >> "$GITHUB_OUTPUT"
        fi
    - name: Sign the evidence
      if: inputs.attest == 'true' && steps.verify.outputs.digest != ''
      uses: actions/attest@v2
      with:
        subject-name: git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}
        subject-digest: sha256:${{ steps.verify.outputs.digest }}
        predicate-type: https://github.com/ArshSharma1x/Agentic-AI/attestations/verification/v0.1
        predicate-path: agentic-predicate.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: agentic-evidence
        path: |
          agentic-report.json
          agentic-evidence.json
        if-no-files-found: ignore
    - name: Gate
      shell: bash
      env:
        CODE: ${{ steps.verify.outputs.code }}
        STRICT: ${{ inputs.fail-on-unverified }}
      run: |
        if [ "$CODE" = "2" ] && [ "$STRICT" != "true" ]; then
          echo "::warning::UNVERIFIED: see the job summary for what needs a human"; exit 0
        fi
        exit "$CODE"
